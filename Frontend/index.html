<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Task App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-indigo-500 to-purple-600">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-80 sm:w-96 text-center">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Welcome Back</h2>
        <form id="loginForm" class="flex flex-col space-y-4">
            <input id="loginEmail" type="email" placeholder="Email"
                class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                required>
            <input id="loginPassword" type="password" placeholder="Password"
                class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                required>
            <button type="submit"
                class="bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition-colors font-semibold">Login</button>
            <p class="text-sm text-gray-600">Don't have an account?
                <a href="signup.html" class="text-indigo-600 hover:underline">Sign up</a>
            </p>
        </form>
        <p id="loginMessage" class="mt-4 text-sm text-red-500"></p>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
