<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Account Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-r from-indigo-500 to-purple-600 p-4">

    <div
        class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 transform transition-all duration-300 hover:scale-[1.01]">
        <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Profile Page</h2>

        <!-- Profile Summary -->
        <div id="profileDetails"
            class="text-gray-700 rounded-lg p-4 mb-6 shadow-inner border border-gray-100 text-sm space-y-1">
            <!-- Filled dynamically -->
        </div>

        <!-- Edit Profile Section Label -->
        <h3 class="text-lg font-semibold text-gray-700 mb-2 border-b pb-1">Edit Profile</h3>

        <!-- Update Form -->
        <form id="updateForm" class="space-y-4 text-left">

            <div>
                <label for="updateName" class="block text-sm font-semibold text-gray-600">Full Name</label>
                <input type="text" id="updateName" placeholder="Enter your name"
                    class="w-full border rounded-lg p-2 mt-1 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>

            <div>
                <label for="updateEmail" class="block text-sm font-semibold text-gray-600">Email (Username)</label>
                <input type="email" id="updateEmail" placeholder="Enter your email"
                    class="w-full border rounded-lg p-2 mt-1 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>

            <div>
                <label for="updatePassword" class="block text-sm font-semibold text-gray-600">New Password</label>
                <input type="password" id="updatePassword" placeholder="Leave blank to keep current"
                    class="w-full border rounded-lg p-2 mt-1 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>

            <button type="submit"
                class="w-full bg-indigo-500 text-white py-2.5 rounded-lg hover:bg-indigo-600 transition-colors font-semibold shadow-md">
                Save Changes
            </button>

            <p id="updateMessage" class="text-sm text-center mt-2 font-medium"></p>
        </form>
    </div>

    <!-- Back to Tasks Button -->
    <button id="backToTasksBtn"
        class="mt-4 w-full max-w-md bg-green-500 text-white py-2.5 rounded-lg hover:bg-green-600 transition-colors font-semibold shadow-md">
        Back to Tasks
    </button>

    <!-- Logout Button -->
    <button id="logoutBtn"
        class="mt-8 w-full max-w-md bg-red-500 text-white py-2.5 rounded-lg hover:bg-red-600 transition-colors font-semibold shadow-md">
        Logout
    </button>

    <script src="script.js" defer></script>
</body>

</html>
